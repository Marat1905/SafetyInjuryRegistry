name: Build, Test and Push Docker Images

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Не используем OWNER напрямую – сделаем преобразование в шаге

jobs:
  # 1. Тестирование кода
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - run: dotnet restore SafetyInjuryRegistry.sln
      - run: dotnet build SafetyInjuryRegistry.sln --no-restore -c Release
      - run: dotnet test SafetyInjuryRegistry.sln --no-build -c Release

  # 2. Проверка Kubernetes манифестов (только для PR)
  lint-k8s:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: |
          # Замените 'k8s/' на путь к вашей папке с манифестами, если она другая
          kubeconform -strict -summary -kubernetes-version 1.29.0 k8s/ || echo "⚠️ Манифесты не найдены или есть ошибки"

  # 3. Сборка и публикация образа (только при push)
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Преобразуем OWNER в нижний регистр и сохраняем в переменную окружения
      - name: Set lowercase owner
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          echo "OWNER_LC=${OWNER_LC,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. API
      - name: Build and push SafetyInjuryRegistry API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Safety.Injuries.API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/safetyinjuryregistry-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/safetyinjuryregistry-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Client (если нужен, сейчас Dockerfile отсутствует)
      # - name: Build and push SafetyInjuryRegistry Client
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: client
      #     file: client/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/safetyinjuryregistry-client:latest
      #       ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/safetyinjuryregistry-client:${{ github.sha }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max